services:
  # ==========================================
  # DAKSHA / StatSaksham AI — Master Backend
  # ==========================================
  - type: web
    name: daksha-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: 20
